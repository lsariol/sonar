name: sonar

x-lighthouse:
  deploy: releases

# Secrets are passed through by their Cove key names; every other setting is in the code.

services:
  sonar-proxy:
    build: .
    container_name: sonar-proxy
    labels:
      com.mobasity.group: infrastructure   # Spark depends on it
    command: ["/sonar", "proxy"]
    restart: unless-stopped
    user: "0:0"                        # the Docker socket is root's; no network, no other privilege
    network_mode: none                 # reached only through the socket in the proxy volume
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]         # reads and lists every data folder, never writes (Lighthouse policy.json)
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # this service only (Lighthouse policy.json)
      - /srv/server/storage:/host/storage:ro        # to size each project's data folder (Lighthouse policy.json)
      - proxy:/run/sonar-proxy
    healthcheck:
      test: ["CMD", "/sonar", "health", "proxy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  sonar-agent:
    build: .
    container_name: sonar-agent
    labels:
      com.mobasity.group: infrastructure   # Spark depends on it
    command: ["/sonar", "agent"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      - SONAR_DATABASE_URL=${SONAR_DATABASE_URL}
      - SONAR_DATABASE_MIGRATOR_URL=${SONAR_DATABASE_MIGRATOR_URL}
      - SONAR_DATABASE_MONITOR_URL=${SONAR_DATABASE_MONITOR_URL}
      - SONAR_CLOUDFLARE_TOKEN=${SONAR_CLOUDFLARE_TOKEN}
      - SONAR_VERSION=${LIGHTHOUSE_DEPLOY_VERSION:-dev}
    volumes:
      - proxy:/run/sonar-proxy
      - state:/var/lib/sonar
      - /proc/1/net/dev:/host/net/dev:ro   # the host's network counters, this one file only (Lighthouse policy.json)
    healthcheck:
      test: ["CMD", "/sonar", "health", "agent"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [spark]

  sonar-api:
    build: .
    container_name: sonar-api
    labels:
      com.mobasity.group: infrastructure   # Spark depends on it
    command: ["/sonar", "api"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    expose: ["2500"]                   # documents the port; not published
    environment:
      - SONAR_DATABASE_READER_URL=${SONAR_DATABASE_READER_URL}
      - SHARED_SONAR_MOBASITY_WEB_TOKEN=${SHARED_SONAR_MOBASITY_WEB_TOKEN}
      - SHARED_SONAR_VISTA_TOKEN=${SHARED_SONAR_VISTA_TOKEN}
      - SONAR_VERSION=${LIGHTHOUSE_DEPLOY_VERSION:-dev}
    volumes:
      - state:/var/lib/sonar:ro
      - /etc/localtime:/etc/localtime:ro   # the CLI shows the server's local time
    healthcheck:
      test: ["CMD", "/sonar", "health", "api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [spark]

volumes:
  proxy:   # the proxy's socket; mounted by the proxy and the agent only
  state:   # snapshot.json; written by the agent, read by the API

networks:
  spark:
    external: true
